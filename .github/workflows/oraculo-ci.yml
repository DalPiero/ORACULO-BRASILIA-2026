name: Oraculo CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Sem package-lock.json, o cache npm do setup-node falha antes dos testes.
      - run: npm install --omit=dev
      - run: |
          node --check server.js
          node --check exports.js
          node --check public/oraculo-api.js
          node --check public/oraculo-eixos.js
          node --check public/oraculo-administracao-inline.js
          node --check public/oraculo-musica.js
      - name: Check HTTP health and authentication
        run: |
          PORT=3000 npm start > /tmp/oraculo.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail -s http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl --fail -s http://127.0.0.1:3000/ > /dev/null
          curl --fail -s http://127.0.0.1:3000/estudio.html > /dev/null
          curl --fail -s http://127.0.0.1:3000/assinar.html > /dev/null
          curl --fail -s http://127.0.0.1:3000/admin.html > /dev/null
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:3000/api/export -H "Content-Type: application/json" -d '{"title":"teste","text":"teste","format":"pdf"}')
          test "$status" = "401"
