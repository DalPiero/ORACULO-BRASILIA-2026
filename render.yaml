services:
  - type: web
    name: oraculo-brasilia-2026
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ORACULO_ADMIN_TOKEN
        sync: false
      - key: ORACULO_MODEL
        value: gpt-4.1-mini
      - key: ORACULO_MAX_QUERIES
        value: '100'
